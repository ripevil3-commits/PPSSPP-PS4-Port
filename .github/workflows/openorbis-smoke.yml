name: OpenOrbis sample smoke build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Fetch the upstream OpenOrbis sample source
        run: git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git _openorbis-toolchain

      - name: Allow the container to write build outputs
        run: chmod -R a+rwX _openorbis-toolchain

      - name: Build and package the upstream SDL2 sample with the official OpenOrbis container
        run: |
          # The current sample uses a sysmodule enum absent from the container's SDK headers.
          # Keep the documented PS4 module ID (0x009A) while building against that SDK.
          sed -i 's/ORBIS_SYSMODULE_FREETYPE_OL/0x009A/g' _openorbis-toolchain/samples/SDL2/SDL2/main.cpp
          docker run --rm \
            --volume "${{ github.workspace }}/_openorbis-toolchain:/workspace" \
            --workdir /workspace/samples/SDL2 \
            openorbisofficial/toolchain:latest \
            bash -lc 'make clean && make'

      - name: Upload sample build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openorbis-sdl2-smoke-build
          path: |
            _openorbis-toolchain/samples/SDL2/SDL2/x64/Debug/SDL2.elf
          if-no-files-found: warn
          retention-days: 7
