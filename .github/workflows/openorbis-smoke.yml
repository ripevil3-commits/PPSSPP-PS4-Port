name: OpenOrbis sample smoke build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Fetch the upstream OpenOrbis sample source
        run: git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git _openorbis-toolchain

      - name: Build and package the upstream SDL2 sample with OpenOrbis
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.4
          command: |
            cd _openorbis-toolchain/samples/SDL2
            make clean
            make

      - name: Upload sample build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openorbis-sdl2-smoke-build
          path: |
            _openorbis-toolchain/samples/SDL2/eboot.bin
            _openorbis-toolchain/samples/SDL2/*.pkg
            _openorbis-toolchain/samples/SDL2/x64/Debug/*.elf
            _openorbis-toolchain/samples/SDL2/x64/Debug/*.oelf
          if-no-files-found: warn
          retention-days: 7
