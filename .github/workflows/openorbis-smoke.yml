name: OpenOrbis project probe build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Fetch the pinned upstream PPSSPP source for a source-layout audit
        run: git clone --depth 1 --branch v1.20.4 --recurse-submodules --shallow-submodules https://github.com/hrydgard/ppsspp.git _ppsspp-upstream

      - name: Audit upstream PPSSPP source layout and C++ standard
        run: bash scripts/audit-ppsspp-source.sh _ppsspp-upstream

      - name: Inventory upstream CMake assumptions that need PS4 adaptation
        run: bash scripts/audit-ps4-cmake-assumptions.sh _ppsspp-upstream/CMakeLists.txt

      - name: Audit experimental OpenOrbis CMake toolchain starter
        run: bash scripts/audit-ps4-toolchain-file.sh

      - name: Fetch the upstream OpenOrbis SDL2 build environment
        run: git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git _openorbis-toolchain

      - name: Allow the container to write build outputs
        run: chmod -R a+rwX _openorbis-toolchain

      - name: Build OpenOrbis create-fself packaging tool
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/create-fself.git _create-fself
          cd _create-fself/cmd/create-fself
          go build -o "$GITHUB_WORKSPACE/_openorbis-toolchain/bin/linux/create-fself" -modfile=go-linux.mod
          test -s "$GITHUB_WORKSPACE/_openorbis-toolchain/bin/linux/create-fself"
          chmod +x "$GITHUB_WORKSPACE/_openorbis-toolchain/bin/linux/create-fself"

      - name: Build this repository's SDL2 probe with the OpenOrbis container
        run: |
          cp ps4-smoke/main.cpp _openorbis-toolchain/samples/SDL2/SDL2/main.cpp
          find _openorbis-toolchain/samples/SDL2/SDL2 -maxdepth 1 -type f -name '*.cpp' ! -name main.cpp -delete
          printf '\nsmoke-elf: $(OBJS)\n\t$(LD) $(INTDIR)/*.o -o $(INTDIR)/$(PROJDIR).elf $(LDFLAGS)\n' >> _openorbis-toolchain/samples/SDL2/Makefile
          docker run --rm --user root \
            --volume "${{ github.workspace }}/_openorbis-toolchain:/workspace" \
            --workdir /workspace/samples/SDL2 \
            openorbisofficial/toolchain:latest \
            bash -lc 'cp /workspace/bin/linux/create-fself /lib/OpenOrbisSDK/bin/linux/create-fself && chmod +x /lib/OpenOrbisSDK/bin/linux/create-fself && make clean && make smoke-elf'

      - name: Build a CMake-enabled OpenOrbis diagnostic image
        run: docker build -f .github/docker/ppsspp-openorbis-cmake.Dockerfile -t ppsspp-openorbis-cmake:ci .

      - name: Verify OpenOrbis source GLES2 headers are mounted in diagnostic container
        run: |
          docker run --rm --volume "${{ github.workspace }}/_openorbis-toolchain:/sdk-source:ro" ppsspp-openorbis-cmake:ci bash -lc 'test -s /sdk-source/include/GLES2/gl2.h && echo "OPENORBIS_GLES2_HEADER_PRESENT=/sdk-source/include/GLES2/gl2.h"'

      - name: Configure and attempt a real upstream PPSSPP build (diagnostic)
        continue-on-error: true
        run: |
          mkdir -p _ppsspp-cmake-build
          # The container runs as the unprivileged `orbis` user, so make the host-mounted
          # build directory writable before CMake creates its cache and compiler probes.
          chmod a+rwx _ppsspp-cmake-build
          set +e
          docker run --rm \
            --volume "${{ github.workspace }}/_ppsspp-upstream:/ppsspp:ro" \
            --volume "${{ github.workspace }}:/project" \
            --volume "${{ github.workspace }}/_ppsspp-cmake-build:/build" \
            --volume "${{ github.workspace }}/_openorbis-toolchain:/sdk-source:ro" \
            --workdir /project \
            ppsspp-openorbis-cmake:ci \
            bash -lc '
              cmake -S /ppsspp -B /build \
                -DCMAKE_TOOLCHAIN_FILE=/project/cmake/ps4-openorbis-toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DLIBRETRO=OFF \
                -DARM_NO_VULKAN=ON -DUSING_GLES2=ON \
                -DUSE_FFMPEG=OFF -DUSE_DISCORD=OFF -DUSE_MINIUPNPC=OFF \
                -DUSE_SYSTEM_LIBSDL2=OFF -DUSE_SYSTEM_LIBPNG=OFF
              configure_result=$?
              echo "CMAKE_CONFIGURE_EXIT=$configure_result"
              if [ "$configure_result" -eq 0 ]; then
                cmake --build /build --parallel 2
                echo "CMAKE_BUILD_EXIT=$?"
              fi
            ' > ppsspp-cmake-build.log 2>&1
          cat ppsspp-cmake-build.log
          exit 0

      - name: Summarize the real PPSSPP build result
        if: always()
        run: |
          {
            echo "## Upstream PPSSPP / OpenOrbis build diagnostic"
            echo
            if [ -f ppsspp-cmake-build.log ]; then
              configure_result=$(grep -Eo 'CMAKE_CONFIGURE_EXIT=-?[0-9]+' ppsspp-cmake-build.log | tail -n 1 | cut -d= -f2 || true)
              build_result=$(grep -Eo 'CMAKE_BUILD_EXIT=-?[0-9]+' ppsspp-cmake-build.log | tail -n 1 | cut -d= -f2 || true)
              echo "- CMake configure exit: ${configure_result:-not recorded}"
              echo "- CMake build exit: ${build_result:-not recorded}"
              echo
              echo "First compiler/build errors:"
              echo '~~~text'
              grep -n -m 8 -E 'fatal error:|error:|Error [0-9]+|FAILED:' ppsspp-cmake-build.log || echo "No matching error lines found; inspect the uploaded full log."
              echo '~~~'
              if [ "${configure_result:-}" != "0" ] || [ "${build_result:-}" != "0" ]; then
                echo
                echo "> **Important:** this diagnostic is not a successful PPSSPP port build. The full log is attached as a workflow artifact."
              fi
            else
              echo "Build log was not generated. Inspect earlier workflow steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload upstream CMake configure and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-openorbis-cmake-build-diagnostics
          path: ppsspp-cmake-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Attempt syntax-only compile of an upstream PPSSPP translation unit
        continue-on-error: true
        run: bash scripts/probe-upstream-translation-unit.sh _ppsspp-upstream _openorbis-toolchain upstream-translation-unit.log

      - name: Upload upstream translation-unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-upstream-translation-unit-diagnostics
          path: upstream-translation-unit.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify linked PS4 ELF exists
        run: test -s _openorbis-toolchain/samples/SDL2/SDL2/x64/Debug/SDL2.elf

      - name: Upload project probe ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-ps4-sdl2-probe-elf
          path: _openorbis-toolchain/samples/SDL2/SDL2/x64/Debug/SDL2.elf
          if-no-files-found: warn
          retention-days: 7
